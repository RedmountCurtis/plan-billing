<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plan Billing · Redmount</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#002347; --ink:#002347; --muted:#5b6b82; --line:#E1DDD1; --line-2:#ECE9E1; --line-strong:#C9C4B4;
  --bg:#F5F3EE; --card:#fff; --accent:#0047AB; --accent-2:#e7edf5; --good:#2F5233; --good-bg:#e7efe6;
  --warn:#8a5a12; --warn-bg:#f8efdc; --bad:#B3261E; --bad-bg:#f9e7e5; --violet:#5b3f9e; --violet-bg:#eeeaf6;
  --radius:8px; --font:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --serif:'Source Serif 4',Georgia,serif; --mono:'IBM Plex Mono','SF Mono',ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--font);-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}

/* top bar */
header.top{background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:28px;padding:0 28px;height:66px;position:sticky;top:0;z-index:20}
header.top .brand{display:flex;flex-direction:column;line-height:1.15;text-decoration:none;white-space:nowrap}
header.top .brand:hover{text-decoration:none}
.logo-mount{font-family:var(--font);font-weight:700;font-size:17px;letter-spacing:.03em;color:var(--ink)}
.logo-capital{font-family:var(--mono);font-weight:600;font-size:9.5px;letter-spacing:.16em;color:var(--accent)}
header.top .tool{font-family:var(--serif);font-size:17px;font-weight:600;color:var(--ink);padding-left:22px;border-left:1px solid var(--line);white-space:nowrap}
header.top nav{display:flex;gap:4px;overflow-x:auto;flex:1;align-self:stretch;align-items:stretch}
header.top nav a{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:0 10px;display:flex;align-items:center;white-space:nowrap;border-bottom:2px solid transparent}
header.top nav a:hover{color:var(--accent);text-decoration:none}
header.top nav a.active{color:var(--accent);border-bottom-color:var(--accent)}
header.top .who{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap;display:flex;gap:14px;align-items:center}
header.top .who a{color:var(--muted)}
header.top .who a:hover{color:var(--accent);text-decoration:none}
@media (max-width:900px){header.top{flex-wrap:wrap;height:auto;padding:10px 16px;gap:8px 18px}header.top .tool{display:none}header.top nav{order:3;flex-basis:100%;height:34px}}
.banner{background:var(--warn-bg);color:var(--warn);padding:8px 28px;font-size:13px;border-bottom:1px solid #eadcbc}

main{max-width:1240px;margin:0 auto;padding:30px 28px 70px}
h1{font-family:var(--serif);font-size:25px;margin:0 0 4px;font-weight:600;color:var(--ink)}
h2{font-family:var(--serif);font-size:17px;margin:0 0 12px;font-weight:600;color:var(--ink)}
.sub{color:var(--muted);margin:0 0 18px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px;margin-bottom:16px}
.grid{display:grid;gap:12px 16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:18px;align-items:start}
@media (max-width:980px){.split{grid-template-columns:1fr}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.g2,.g3,.g4{grid-template-columns:1fr}main{padding:16px}}

label.f{display:flex;flex-direction:column;gap:5px;font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
input[type=text],input[type=email],input[type=password],input[type=date],input[type=number],select,textarea{
  border:1px solid var(--line-strong);border-radius:4px;padding:8px 10px;background:#fff;font-size:13.5px;width:100%;min-width:0;text-transform:none;letter-spacing:0;font-weight:400;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-2)}
textarea{resize:vertical;min-height:60px}
input.money,input.numr{text-align:right;font-variant-numeric:tabular-nums}
.check{display:flex;gap:8px;align-items:center;font-size:13px}

.btn{border:1px solid var(--line-strong);background:#fff;border-radius:4px;padding:7px 14px;cursor:pointer;font-size:13px;font-weight:500;white-space:nowrap;color:var(--ink);display:inline-block}
.btn:hover{border-color:var(--accent);color:var(--accent);text-decoration:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#1a4b8c;color:#fff}
.btn.good:hover{background:#244026;color:#fff}
.btn.danger:hover{color:var(--bad);border-color:var(--bad)}
.btn.good{background:var(--good);border-color:var(--good);color:#fff}
.btn.danger{color:var(--bad);border-color:#efc4c4}
.btn.danger:hover{background:var(--bad-bg)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn.link{border:none;background:none;color:var(--accent);padding:4px 6px}
.btn:disabled{opacity:.5;cursor:not-allowed}

table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th{text-align:left;font-family:var(--mono);font-weight:600;color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;padding:10px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:8px 10px;border-bottom:1px solid var(--line-2);vertical-align:middle}
table.t tbody tr:hover td{background:#fbfaf7}
table.t .r{text-align:right;font-variant-numeric:tabular-nums}
table.t tfoot td{font-weight:600;border-top:1px solid var(--line);border-bottom:none}
.tablewrap{overflow-x:auto}
table.edit td{padding:4px 6px}
table.edit input{padding:5px 7px}

.chip{display:inline-block;padding:2px 8px;border-radius:3px;font-family:var(--mono);font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;vertical-align:middle}
.st-draft{background:#ECE9E1;color:#5b6b82}
.st-reviewed{background:var(--violet-bg);color:var(--violet)}
.st-approved{background:var(--accent-2);color:var(--accent)}
.st-sent{background:var(--warn-bg);color:var(--warn)}
.st-paid{background:var(--good-bg);color:var(--good)}
.st-void{background:var(--bad-bg);color:var(--bad);text-decoration:line-through}
.muted{color:var(--muted)}
.small{font-size:12px}
.mono{font-family:var(--mono);font-size:12.5px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
.stat .k{font-family:var(--mono);font-size:10px;color:var(--accent);text-transform:uppercase;letter-spacing:.08em}
.stat .v{font-family:var(--serif);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:4px}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.err{background:var(--bad-bg);color:var(--bad);padding:9px 12px;border-radius:6px;font-size:13px;margin-bottom:12px}
.ok{background:var(--good-bg);color:var(--good);padding:9px 12px;border-radius:6px;font-size:13px;margin-bottom:12px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:4px;font-size:13px;z-index:100;box-shadow:0 8px 24px -8px rgba(0,35,71,.35)}
.toast.bad{background:var(--bad)}
.sectionlabel{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);font-weight:600;margin:18px 0 8px}
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:4px}
.hint{font-size:12px;color:var(--muted);margin-top:4px}
.previewbox{background:#E9E5DA;border-radius:var(--radius);padding:18px;position:sticky;top:82px}
.audit{font-size:12.5px;color:var(--muted);line-height:1.7}

/* login — same as Terminal */
.authgate{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:200;padding:24px}
.authcard{background:#fff;border:1px solid var(--line);border-radius:8px;width:100%;max-width:380px;padding:32px 32px 26px;box-shadow:0 8px 24px -12px rgba(51,51,51,.18)}
.authcard .auth-logo{margin-bottom:20px;display:flex;flex-direction:column;gap:2px}
.authcard .auth-logo .logo-mount{font-size:22px}.authcard .auth-logo .logo-capital{font-size:11px}
.authcard h1{font-size:21px;margin:14px 0 4px}
.authcard p.sub{font-size:12.5px;color:var(--muted);margin:0 0 22px}
.authcard label{display:block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:5px;margin-top:16px}
.authcard input{width:100%;padding:10px 12px;border:1px solid var(--line-strong);border-radius:4px;font-size:13.5px;background:var(--bg);color:var(--ink)}
.authcard input:focus{outline:none;border-color:var(--accent);box-shadow:none}
.authcard button{width:100%;margin-top:20px;padding:11px;background:var(--accent);border:1px solid var(--accent);color:#fff;border-radius:4px;font-size:13px;font-weight:600;cursor:pointer;letter-spacing:.02em}
.authcard button:hover{background:#1a4b8c}
.authcard button:disabled{opacity:.6;cursor:not-allowed}
.authcard .err{font-size:12.5px;color:var(--bad);margin-top:10px;background:none;padding:0}
.authcard .foot{font-size:12px;color:var(--muted);margin-top:18px}

/* ---------- invoice document ---------- */
.doc{background:#fff;color:#1b2533;width:100%;max-width:8.5in;margin:0 auto;padding:.6in .65in;box-shadow:0 2px 14px rgba(0,35,71,.10);position:relative;font-family:var(--font);font-size:12.5px;line-height:1.45}
.doc .wm{position:absolute;top:38%;left:0;right:0;text-align:center;font-size:84px;font-weight:700;color:rgba(197,48,48,.08);transform:rotate(-24deg);pointer-events:none;letter-spacing:.08em}
.doc .lh{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid var(--navy);padding-bottom:14px;margin-bottom:20px;gap:20px}
.doc .lh .firm{font-family:var(--serif);font-size:21px;font-weight:600;color:var(--navy)}
.doc .lh .lm{font-weight:700;font-size:19px;letter-spacing:.03em;color:var(--navy);display:block}
.doc .lh .lc{font-family:var(--mono);font-weight:600;font-size:9.5px;letter-spacing:.16em;color:var(--accent);display:block;margin-top:1px}
.doc .lh .firmaddr{white-space:pre-line;color:#444;font-size:11.5px;margin-top:4px}
.doc .lh img{max-height:54px;max-width:220px;display:block;margin-bottom:6px}
.doc .title{text-align:right}
.doc .title .tt{font-family:var(--serif);font-size:25px;font-weight:600;color:var(--navy)}
.doc .title table{margin-left:auto;margin-top:6px;border-collapse:collapse;font-size:11.5px}
.doc .title td{padding:1px 0 1px 12px}
.doc .title td:first-child{color:#666;text-align:right}
.doc .title td:last-child{font-weight:600;text-align:right}
.doc .parties{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}
.doc .lbl{font-family:var(--mono);font-size:9.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);font-weight:600;margin-bottom:4px}
.doc .addr{white-space:pre-line}
.doc table.dt{width:100%;border-collapse:collapse;margin-bottom:16px}
.doc table.dt th{text-align:left;font-family:var(--mono);font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;color:#5b6b82;border-bottom:1px solid #9aa3b0;padding:5px 6px;font-weight:600}
.doc table.dt td{padding:5px 6px;border-bottom:1px solid #e3e3e3;font-variant-numeric:tabular-nums}
.doc table.dt .r{text-align:right}
.doc table.dt tr.sub td{border-top:1px solid #999;font-weight:600}
.doc table.dt tr.tot td{border-top:2px solid var(--navy);border-bottom:none;font-weight:700;font-size:14px;color:var(--navy);padding-top:8px}
.doc .secthead{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);font-weight:600;margin:6px 0 6px}
.doc .basis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;background:#F7F5F0;border:1px solid #E1DDD1;padding:10px 12px;border-radius:4px;margin-bottom:18px}
.doc .basis .k{font-family:var(--mono);font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:#5b6b82}
.doc .basis .v{font-weight:600}
.doc .remit{border:1px solid #E1DDD1;border-left:3px solid var(--accent);border-radius:2px;padding:10px 12px;margin:14px 0;white-space:pre-line}
.doc .disc{font-size:10.5px;color:#666;border-top:1px solid #ddd;padding-top:10px;margin-top:22px;white-space:pre-line}
.doc .notes{white-space:pre-line;margin:10px 0}
@media (max-width:700px){.doc{padding:22px 18px}.doc .basis{grid-template-columns:1fr 1fr}.doc .parties{grid-template-columns:1fr}.doc .lh{flex-direction:column}.doc .title{text-align:left}.doc .title table{margin-left:0}}

@media print{
  @page{size:letter;margin:0}
  body{background:#fff}
  header.top,.banner,.noprint,.toast{display:none!important}
  main{padding:0;max-width:none}
  .previewbox{background:none;padding:0;position:static}
  .split{display:block}
  .doc{box-shadow:none;max-width:none;width:8.5in;min-height:11in;page-break-after:always}
  .doc:last-child{page-break-after:auto}
  .printonly-container > *:not(.docstack){display:none!important}
}

const CONFIG = {

  SUPABASE_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBkeW1wYnB5YXZpbHN0anNtanRtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU3ODc1NjUsImV4cCI6MjEwMTM2MzU2NX0.zb-moqwGSoOB-rq9OSqk6cLt0JqXlzRBLebMLE2R4DA',

  INVOICE_PREFIX_LOCAL: 'RCP-'

<script>
/* ==== BILLING CALC ENGINE (start) ==== */
const BillingCalc = (() => {
  const PERIODS = { monthly: 12, quarterly: 4, semiannual: 2, annual: 1 };
  const DAY = 86400000;

  const r2 = n => Math.round((n + Number.EPSILON) * 100) / 100;
  const num = v => {
    if (v === null || v === undefined || v === '') return 0;
    const n = typeof v === 'number' ? v : parseFloat(String(v).replace(/[$,\s]/g, ''));
    return isFinite(n) ? n : 0;
  };
  const parseDate = s => { const [y, m, d] = String(s).split('-').map(Number); return Date.UTC(y, m - 1, d); };
  const daysInclusive = (a, b) => Math.round((parseDate(b) - parseDate(a)) / DAY) + 1;
  const isLeap = y => (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0;

  // Annual asset-based fee from schedule
  function assetFee(assets, s) {
    const lines = [];
    if (assets <= 0) return { annual: 0, lines };
    const type = s.type || 'tiered';
    if (type === 'flat_bps') {
      const bps = num(s.flatBps);
      lines.push({ label: `All assets @ ${fmtBps(bps)}`, base: assets, bps, annual: assets * bps / 10000 });
    } else if (type === 'flat_fee') {
      // no asset component
    } else {
      const tiers = (s.tiers || [])
        .map(t => ({ upTo: (t.upTo === null || t.upTo === '' || t.upTo === undefined) ? Infinity : num(t.upTo), bps: num(t.bps) }))
        .sort((a, b) => a.upTo - b.upTo);
      if (!tiers.length) return { annual: 0, lines };
      if (tiers[tiers.length - 1].upTo !== Infinity) tiers[tiers.length - 1].upTo = Infinity;
      if (type === 'breakpoint') {
        const t = tiers.find(t => assets <= t.upTo) || tiers[tiers.length - 1];
        lines.push({ label: `All assets @ ${fmtBps(t.bps)} (breakpoint ${tierRangeLabel(tiers, tiers.indexOf(t))})`, base: assets, bps: t.bps, annual: assets * t.bps / 10000 });
      } else { // tiered / graduated (marginal)
        let lower = 0;
        tiers.forEach((t, i) => {
          if (assets <= lower) return;
          const slice = Math.min(assets, t.upTo) - lower;
          if (slice > 0) lines.push({ label: `${tierRangeLabel(tiers, i)} @ ${fmtBps(t.bps)}`, base: slice, bps: t.bps, annual: slice * t.bps / 10000 });
          lower = t.upTo;
        });
      }
    }
    return { annual: lines.reduce((a, l) => a + l.annual, 0), lines };
  }

  function tierRangeLabel(tiers, i) {
    const lo = i === 0 ? 0 : tiers[i - 1].upTo;
    const hi = tiers[i].upTo;
    const m = v => '$' + compact(v);
    if (hi === Infinity) return `Over ${m(lo)}`;
    if (lo === 0) return `First ${m(hi)}`;
    return `${m(lo)} – ${m(hi)}`;
  }
  function compact(v) {
    if (v >= 1e9 && v % 1e7 === 0) return (v / 1e9).toLocaleString('en-US', { maximumFractionDigits: 2 }) + 'B';
    if (v >= 1e6 && v % 1e4 === 0) return (v / 1e6).toLocaleString('en-US', { maximumFractionDigits: 2 }) + 'M';
    if (v >= 1e3 && v % 10 === 0) return (v / 1e3).toLocaleString('en-US', { maximumFractionDigits: 2 }) + 'K';
    return v.toLocaleString('en-US');
  }
  function fmtBps(bps) { return `${(+bps).toLocaleString('en-US', { maximumFractionDigits: 3 })} bps`; }

  // Fraction of a year this invoice covers
  function periodFactor(plan, periodStart, periodEnd, serviceStart) {
    const ppy = PERIODS[plan.frequency] || 4;
    const fullDays = daysInclusive(periodStart, periodEnd);
    let billedStart = periodStart;
    if (serviceStart && parseDate(serviceStart) > parseDate(periodStart) && parseDate(serviceStart) <= parseDate(periodEnd)) billedStart = serviceStart;
    const billedDays = daysInclusive(billedStart, periodEnd);
    const method = plan.proration || 'periodic';
    let factor, basis;
    if (method === 'actual_365') {
      factor = billedDays / 365; basis = `${billedDays} days / 365`;
    } else if (method === 'actual_actual') {
      const y = new Date(parseDate(periodEnd)).getUTCFullYear();
      const yd = isLeap(y) ? 366 : 365;
      factor = billedDays / yd; basis = `${billedDays} days / ${yd}`;
    } else {
      factor = 1 / ppy; basis = `1/${ppy} of annual`;
      if (billedDays < fullDays) { factor *= billedDays / fullDays; basis += ` × ${billedDays}/${fullDays} days (partial period)`; }
    }
    return { factor, basis, billedDays, fullDays, billedStart, periodsPerYear: ppy };
  }

  function valuation(plan, inputs) {
    const m = plan.valuation_method || 'period_end';
    const vals = (inputs.values || []).map(v => ({ label: v.label || '', value: num(v.value) })).filter(v => v.value !== 0 || v.label);
    let gross, desc;
    if (m === 'average') {
      const used = vals.filter(v => v.value !== 0);
      gross = used.length ? used.reduce((a, v) => a + v.value, 0) / used.length : 0;
      desc = `Average of ${used.length} valuation${used.length === 1 ? '' : 's'}`;
    } else {
      gross = vals.length ? vals[0].value : 0;
      desc = { period_end: 'Period-end market value', period_start: 'Prior period-end market value', adb: 'Average daily balance' }[m] || 'Market value';
    }
    const exclusions = (inputs.exclusions || []).map(e => ({ label: e.label || 'Excluded assets', value: num(e.value) })).filter(e => e.value);
    const excluded = exclusions.reduce((a, e) => a + e.value, 0);
    return { method: m, desc, values: vals, gross, exclusions, excluded, billable: Math.max(0, gross - excluded) };
  }

  function calculate(plan, inputs) {
    const s = plan.schedule || {};
    const val = valuation(plan, inputs);
    const pf = periodFactor(plan, inputs.periodStart, inputs.periodEnd, inputs.serviceStart);
    const participants = Math.max(0, Math.round(num(inputs.participants)));

    const af = assetFee(val.billable, s);
    const lines = af.lines.map(l => ({ kind: 'asset', ...l, period: l.annual * pf.factor }));

    const baseFee = num(s.baseFeeAnnual) + (s.type === 'flat_fee' ? num(s.flatAnnualFee) : 0);
    if (baseFee) lines.push({ kind: 'fixed', label: s.type === 'flat_fee' && !num(s.baseFeeAnnual) ? 'Flat advisory fee' : 'Base / fixed fee', annual: baseFee, period: baseFee * pf.factor });
    const ppAnnual = num(s.perParticipantAnnual);
    if (ppAnnual && participants) lines.push({ kind: 'participant', label: `${participants} participants × $${ppAnnual.toFixed(2)}/yr`, annual: ppAnnual * participants, period: ppAnnual * participants * pf.factor });

    const annualCalc = lines.reduce((a, l) => a + l.annual, 0);
    let subtotal = lines.reduce((a, l) => a + l.period, 0);

    let minMax = null;
    const minA = num(s.minimumAnnual), maxA = num(s.maximumAnnual);
    if (minA && annualCalc < minA) {
      const target = minA * pf.factor;
      minMax = { kind: 'minimum', label: `Annual minimum ($${fmtMoney(minA)}) adjustment`, amount: target - subtotal };
      subtotal = target;
    } else if (maxA && annualCalc > maxA) {
      const target = maxA * pf.factor;
      minMax = { kind: 'maximum', label: `Annual maximum ($${fmtMoney(maxA)}) adjustment`, amount: target - subtotal };
      subtotal = target;
    }

    let discount = null;
    const dPct = num(s.discountPct);
    if (dPct) { discount = { label: `Discount (${dPct}%)`, amount: -subtotal * dPct / 100 }; subtotal += discount.amount; }

    const adjustments = (inputs.adjustments || []).map(a => ({ label: a.label || 'Adjustment', amount: r2(num(a.amount)) })).filter(a => a.amount);
    const feeBeforeAdj = r2(subtotal);
    const total = r2(feeBeforeAdj + adjustments.reduce((a, x) => a + x.amount, 0));

    const effectiveBps = val.billable > 0 ? (feeBeforeAdj / pf.factor) / val.billable * 10000 : null;

    return {
      version: 1,
      valuation: val,
      period: pf,
      participants,
      lines: lines.map(l => ({ ...l, annual: r2(l.annual), period: r2(l.period) })),
      annualCalculated: r2(annualCalc),
      minMax: minMax ? { ...minMax, amount: r2(minMax.amount) } : null,
      discount: discount ? { ...discount, amount: r2(discount.amount) } : null,
      feeBeforeAdjustments: feeBeforeAdj,
      adjustments,
      total,
      effectiveBps: effectiveBps === null ? null : Math.round(effectiveBps * 100) / 100
    };
  }

  function fmtMoney(n) { return (+n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }

  // Standard calendar periods
  function periodsFor(frequency, year) {
    const pad = n => String(n).padStart(2, '0');
    const end = (y, m) => `${y}-${pad(m)}-${pad(new Date(Date.UTC(y, m, 0)).getUTCDate())}`;
    const out = [];
    if (frequency === 'monthly') for (let m = 1; m <= 12; m++) out.push({ label: new Date(Date.UTC(year, m - 1, 1)).toLocaleString('en-US', { month: 'short', timeZone: 'UTC' }) + ' ' + year, start: `${year}-${pad(m)}-01`, end: end(year, m) });
    else if (frequency === 'semiannual') { out.push({ label: `H1 ${year}`, start: `${year}-01-01`, end: `${year}-06-30` }); out.push({ label: `H2 ${year}`, start: `${year}-07-01`, end: `${year}-12-31` }); }
    else if (frequency === 'annual') out.push({ label: `FY ${year}`, start: `${year}-01-01`, end: `${year}-12-31` });
    else for (let q = 1; q <= 4; q++) out.push({ label: `Q${q} ${year}`, start: `${year}-${pad(q * 3 - 2)}-01`, end: end(year, q * 3) });
    return out;
  }

  return { calculate, periodsFor, num, r2, fmtMoney, daysInclusive, PERIODS, tierRangeLabel };
})();
/* ==== BILLING CALC ENGINE (end) ==== */

</script>

class AuthRequired extends Error { constructor() { super('Sign in required'); this.authRequired = true; } }
const Auth = {
  url: CONFIG.SUPABASE_URL + '/auth/v1',
  load() { try { const r = localStorage.getItem(CONFIG.SESSION_KEY); return r ? JSON.parse(r) : null; } catch (e) { return null; } },
  save(data, prevEmail) {
    const s = { access_token: data.access_token, refresh_token: data.refresh_token, expires_at: Date.now() + (data.expires_in || 3600) * 1000, email: (data.user && data.user.email) || prevEmail };
    try { localStorage.setItem(CONFIG.SESSION_KEY, JSON.stringify(s)); } catch (e) {}

  },
  clear() { try { localStorage.removeItem(CONFIG.SESSION_KEY); } catch (e) {} },
  async post(grant, body) {
    const res = await fetch(`${this.url}/token?grant_type=${grant}`, { method: 'POST', headers: { apikey: CONFIG.SUPABASE_KEY, 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error_description || data.msg || 'Incorrect email or password');
    return data;
  },
  async signIn(email, password) { return this.save(await this.post('password', { email, password })); },
  _refreshing: null,
  async session() {
    const s = this.load();
    if (!s || !s.access_token) throw new AuthRequired();
    if (Date.now() < s.expires_at - 60000) return s;
    if (!this._refreshing) this._refreshing = (async () => {
      try { return this.save(await this.post('refresh_token', { refresh_token: s.refresh_token }), s.email); }
      catch (e) {
        // another tab (e.g. the Terminal) may have refreshed first — use its token if so
        const now = this.load();
        if (now && now.access_token !== s.access_token && Date.now() < now.expires_at - 60000) return now;
        this.clear(); throw new AuthRequired();
      }
      finally { setTimeout(() => { this._refreshing = null; }, 0); }
    })();
    return this._refreshing;
  }
};

/* ---- PostgREST over fetch (no client library, same as the Terminal) ---- */
async function rest(method, path, { body, prefer } = {}) {
  const s = await Auth.session();
  const headers = { apikey: CONFIG.SUPABASE_KEY, Authorization: 'Bearer ' + s.access_token, 'Content-Type': 'application/json' };
  if (prefer) headers.Prefer = prefer;
  const res = await fetch(`${CONFIG.SUPABASE_URL}/rest/v1/${path}`, { method, headers, body: body === undefined ? undefined : JSON.stringify(body) });
  if (res.status === 401) { Auth.clear(); throw new AuthRequired(); }
  const text = await res.text();
  let data = null; try { data = text ? JSON.parse(text) : null; } catch (e) { data = text; }
  if (!res.ok) { const e = new Error((data && (data.message || data.hint)) || `${res.status} ${res.statusText}`); e.code = data && data.code; throw e; }
  return data;
}

        <tr class="tot"><td colspan="3">${deduct ? 'Fee to be deducted from plan assets' : 'Total amount due'}</td><td class="r">${money(c.total)}</td></tr>
      </tbody></table>
    ${c.effectiveBps !== null && c.effectiveBps !== undefined ? `<div class="small" style="color:#666">Effective annual rate on billable assets: ${c.effectiveBps.toFixed(2)} bps (${(c.effectiveBps / 100).toFixed(4)}%)</div>` : ''}
    ${inv.notes ? `<div class="notes"><div class="lbl" style="margin-top:12px">Notes</div>${esc(inv.notes)}</div>` : ''}
    <div class="remit">${esc(deduct ? s.deductNote : s.remit)}</div>
    <div class="disc">${esc(s.disclosure)}</div>
  </div>`;
}

/* snapshot of plan terms stored on each invoice */
function planSnapshot(p) {
  const keys = ['id', 'code', 'name', 'sponsor_name', 'plan_number', 'recordkeeper', 'contact_name', 'contact_email', 'contact_address', 'billing_method', 'frequency', 'timing', 'valuation_method', 'proration', 'terms_days', 'schedule'];

}

function printDocs(docs) {
  if (!docs.length) return;
  const holder = document.createElement('div'); holder.className = 'docstack'; holder.innerHTML = docs.join('');
  document.body.classList.add('printonly-container'); document.body.appendChild(holder);
  const done = () => { holder.remove(); document.body.classList.remove('printonly-container'); window.removeEventListener('afterprint', done); };
  window.addEventListener('afterprint', done);
  setTimeout(() => window.print(), 50);
}
function download(name, text, type) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

/* status workflow */
const FLOW = { draft: ['reviewed', 'void'], reviewed: ['approved', 'draft', 'void'], approved: ['sent', 'paid', 'void'], sent: ['paid', 'void'], paid: [], void: [] };
const canMove = (from, to) => (FLOW[from] || []).includes(to);
function statusPatch(to) {
  const now = new Date().toISOString(), who = DB.user?.email || 'local';
  const p = { status: to };
  if (to === 'reviewed') { p.reviewed_by_email = who; p.reviewed_at = now; }
  if (to === 'approved') { p.approved_by_email = who; p.approved_at = now; }
  if (to === 'sent') p.sent_at = now;
  if (to === 'paid') p.paid_at = now;
  if (to === 'void') p.voided_at = now;
  if (to === 'draft') { p.reviewed_by_email = null; p.reviewed_at = null; }
  return p;
}

function scheduleSummary(s) {
  const parts = [`<b>${esc(LABELS.schedule[s.type] || 'Tiered')}</b>`];
  if (s.type === 'flat_bps') parts.push(`${C.num(s.flatBps)} bps on all assets`);
  if (s.type === 'flat_fee') parts.push(`${money(s.flatAnnualFee)} per year`);
  if ((s.type === 'tiered' || s.type === 'breakpoint' || !s.type) && s.tiers?.length) {
    const t = s.tiers.map(x => ({ upTo: x.upTo === null || x.upTo === '' ? Infinity : C.num(x.upTo), bps: C.num(x.bps) })).sort((a, b) => a.upTo - b.upTo);
    if (t.length) t[t.length - 1].upTo = Infinity;
    parts.push(t.map((x, i) => `${esc(C.tierRangeLabel(t, i))}: ${x.bps} bps`).join('<br>'));
  }
  if (C.num(s.baseFeeAnnual)) parts.push(`Base fee ${money(s.baseFeeAnnual)}/yr`);
  if (C.num(s.perParticipantAnnual)) parts.push(`${money(s.perParticipantAnnual)} per participant/yr`);
  if (C.num(s.minimumAnnual)) parts.push(`Annual minimum ${money(s.minimumAnnual)}`);
  if (C.num(s.maximumAnnual)) parts.push(`Annual maximum ${money(s.maximumAnnual)}`);
  if (C.num(s.discountPct)) parts.push(`Discount ${C.num(s.discountPct)}%`);
  return parts.join('<br>');
}

   ========================================================================= */
function defaultValueRows(plan, period) {
  if (!plan) return [{ label: '', value: '' }];
  const m = plan.valuation_method;
  if (m === 'average') {
    if (!period) return [{ label: '', value: '' }, { label: '', value: '' }, { label: '', value: '' }];
    // month-end dates in the period
    const rows = []; let [y, mo] = period.start.split('-').map(Number);
    const [ey, em] = period.end.split('-').map(Number);
    while (y < ey || (y === ey && mo <= em)) { const d = new Date(Date.UTC(y, mo, 0)).toISOString().slice(0, 10); rows.push({ label: `Value as of ${fmtDate(d)}`, value: '' }); mo++; if (mo > 12) { mo = 1; y++; } if (rows.length > 12) break; }
    return rows.length ? rows : [{ label: '', value: '' }];
  }
  if (m === 'period_start' && period) return [{ label: `Value as of ${fmtDate(addDays(period.start, -1))}`, value: '' }];
  if (m === 'adb') return [{ label: 'Average daily balance (from recordkeeper)', value: '' }];
  return [{ label: period ? `Value as of ${fmtDate(period.end)}` : 'Period-end value', value: '' }];
}

async function viewNew(query, editId) {
  await refresh();
  const params = new URLSearchParams(query || '');
  let editing = null;
  if (editId) { editing = await DB.invoice(editId); if (!editing) return main('<div class="err">Invoice not found.</div>'); if (!['draft', 'reviewed'].includes(editing.status)) return main(`<div class="err">${esc(editing.invoice_number)} is ${esc(editing.status)} and can't be edited. Void it and re-issue.</div>`); }
  const active = S.plans.filter(p => p.active || p.id === editing?.plan_id);
  if (!active.length) return main(`<h1>New invoice</h1><div class="card empty">Add a plan with its fee schedule first.<br><br><a class="btn primary" href="#/plan/new">Add plan</a></div>`);

  const year = new Date().getFullYear();
  const st = {
    planId: editing?.plan_id || params.get('plan') || active[0].id,
    year: editing ? +editing.period_end.slice(0, 4) : year,
    periodIdx: null, custom: false,
    periodStart: editing?.period_start || '', periodEnd: editing?.period_end || '', periodLabel: editing?.period_label || '',
    invoiceDate: editing?.invoice_date || todayISO(),
    serviceStart: editing?.inputs?.serviceStart || '',
    values: editing?.inputs?.values ? deep(editing.inputs.values) : null,
    exclusions: editing?.inputs?.exclusions ? deep(editing.inputs.exclusions) : [],
    participants: editing?.inputs?.participants ?? '',
    adjustments: editing?.inputs?.adjustments ? deep(editing.inputs.adjustments) : [],
    notes: editing?.notes || ''
  };
  const plan = () => planById(st.planId);

  function pickDefaultPeriod() {
    const p = plan(); const per = C.periodsFor(p.frequency, st.year);
    if (st.periodStart) { const i = per.findIndex(x => x.start === st.periodStart && x.end === st.periodEnd); if (i >= 0) { st.periodIdx = i; st.custom = false; } else st.custom = true; return; }
    // arrears → most recently completed period; advance → current/next period
    const t = todayISO(); let i;
    if (p.timing === 'advance') { i = per.findIndex(x => x.end >= t); if (i < 0) i = per.length - 1; }
    else { i = -1; per.forEach((x, k) => { if (x.end < t) i = k; }); if (i < 0) { st.year--; return pickDefaultPeriod(); } }
    st.periodIdx = i; applyPeriod();
  }
  function applyPeriod() {
    const per = C.periodsFor(plan().frequency, st.year)[st.periodIdx];
    if (per) { st.periodStart = per.start; st.periodEnd = per.end; st.periodLabel = per.label; }
  }
  function prefillFromHistory() {
    const prev = S.invoices.filter(i => i.plan_id === st.planId && i.status !== 'void' && i.id !== editing?.id).sort((a, b) => b.period_end.localeCompare(a.period_end))[0];
    if (prev) {
      if (st.participants === '') st.participants = prev.inputs?.participants ?? '';
      if (!st.exclusions.length && prev.inputs?.exclusions?.length) st.exclusions = prev.inputs.exclusions.map(e => ({ label: e.label, value: '' }));
    }
    return prev;
  }
  pickDefaultPeriod();
  if (!st.values) st.values = defaultValueRows(plan(), { start: st.periodStart, end: st.periodEnd });
  let prev = prefillFromHistory();

  function draftInvoice() {
    const p = plan();
    const inputs = { periodStart: st.periodStart, periodEnd: st.periodEnd, serviceStart: st.serviceStart || null, values: st.values, exclusions: st.exclusions, participants: st.participants, adjustments: st.adjustments };
    const ok = st.periodStart && st.periodEnd && st.periodEnd >= st.periodStart;
    const calc = ok ? C.calculate(p, inputs) : null;
    return {
      ok, inputs, calc,
      row: {
        plan_id: p.id, period_label: st.periodLabel || `${fmtDate(st.periodStart)} – ${fmtDate(st.periodEnd)}`,
        period_start: st.periodStart, period_end: st.periodEnd, invoice_date: st.invoiceDate,
        due_date: p.billing_method === 'deduct_from_plan' ? null : addDays(st.invoiceDate, +p.terms_days || 30),
        inputs: { ...inputs, values: st.values.map(v => ({ label: v.label, value: C.num(v.value) })), exclusions: st.exclusions.map(v => ({ label: v.label, value: C.num(v.value) })), participants: C.num(st.participants), adjustments: st.adjustments.map(a => ({ label: a.label, amount: C.num(a.amount) })) },
        plan_snapshot: planSnapshot(p), calc, amount: calc?.total ?? 0, billable_assets: calc?.valuation.billable ?? 0, notes: st.notes || null
      }
    };
  }

  function rowsEditor(key, cols) {
    return `<table class="edit" style="width:100%"><tbody>${st[key].map((r, i) => `<tr>
        <td><input type="text" data-rk="${key}" data-i="${i}" data-f="label" value="${esc(r.label)}" placeholder="${esc(cols[0])}"></td>
        <td style="width:42%"><input type="text" class="money" data-rk="${key}" data-i="${i}" data-f="${cols[2]}" value="${esc(commas(r[cols[2]]) || r[cols[2]] || '')}" placeholder="${esc(cols[1])}"></td>
        <td style="width:30px"><button class="btn link" data-del="${key}" data-i="${i}" title="Remove">✕</button></td></tr>`).join('')}</tbody></table>`;
  }

  function draw() {
    const p = plan();
    const per = C.periodsFor(p.frequency, st.year);
    const dupe = S.invoices.find(i => i.plan_id === p.id && i.period_start === st.periodStart && i.period_end === st.periodEnd && i.status !== 'void' && i.id !== editing?.id);
    main(`
      <div class="spread"><div><a href="${editing ? '#/invoice/' + esc(editing.id) : '#/invoices'}" class="small">← ${editing ? esc(editing.invoice_number) : 'Invoices'}</a>
        <h1 style="margin-top:4px">${editing ? 'Edit ' + esc(editing.invoice_number) : 'New invoice'}</h1></div></div>
      <div class="split">
        <div>
          <div class="card">
            <div class="grid g2">
              <label class="f">Plan<select id="plan">${active.map(x => `<option value="${esc(x.id)}"${x.id === p.id ? ' selected' : ''}${editing ? ' disabled' : ''}>${esc(x.name)} (${esc(x.code)})</option>`).join('')}</select></label>
              <label class="f">Invoice date<input type="date" id="idate" value="${esc(st.invoiceDate)}"></label>
            </div>
            <div class="hint">${esc(LABELS.frequency[p.frequency])}, ${esc(LABELS.timing[p.timing].toLowerCase())} · ${esc(LABELS.valuation_method[p.valuation_method])} · ${esc(LABELS.billing_method[p.billing_method])} · <a href="#/plan/${esc(p.id)}">edit plan</a></div>
            <div class="sectionlabel">Calculation period</div>

              <label class="f">Service start (partial period)<input type="date" id="svc" value="${esc(st.serviceStart)}" min="${esc(st.periodStart)}" max="${esc(st.periodEnd)}"></label>
            </div>
            ${st.custom ? `<div class="grid g3" style="margin-top:10px">
              <label class="f">Period start<input type="date" id="ps" value="${esc(st.periodStart)}"></label>
              <label class="f">Period end<input type="date" id="pe" value="${esc(st.periodEnd)}"></label>

            ${dupe ? `<div class="err" style="margin-top:10px">This plan already has ${esc(dupe.invoice_number)} (${esc(dupe.status)}) for this period. <a href="#/invoice/${esc(dupe.id)}">Open it</a>, or void it before re-issuing.</div>` : ''}
          </div>
          <div class="card">
            <h2>Values</h2>

            ${p.valuation_method === 'average' ? '<div class="hint">Blank rows are ignored in the average.</div>' : (st.values.length > 1 ? '<div class="hint">Only the first value is used for this valuation method.</div>' : '')}
            <div class="sectionlabel">Excluded assets (not billable)</div>
            ${st.exclusions.length ? rowsEditor('exclusions', ['e.g. Participant loans, SDBA, employer stock', 'Amount', 'value']) : '<div class="small muted">None</div>'}
            <button class="btn sm" data-add="exclusions" style="margin-top:6px">+ Add exclusion</button>
            <div class="grid g2" style="margin-top:14px">
              <label class="f">Participants (for per-head fees)<input type="text" class="numr" id="pp" value="${esc(st.participants)}" inputmode="numeric"></label>
            </div>
            ${prev ? `<div class="hint">Last invoice: ${esc(prev.invoice_number)} · ${esc(prev.period_label)} · ${money0(prev.billable_assets)} billable · ${money(prev.amount)}</div>` : ''}
          </div>
          <div class="card">
            <h2>Adjustments</h2>
            ${st.adjustments.length ? rowsEditor('adjustments', ['e.g. Credit for prior-period overbilling', 'Amount (negative = credit)', 'amount']) : '<div class="small muted">None</div>'}
            <button class="btn sm" data-add="adjustments" style="margin-top:6px">+ Add adjustment</button>
            <label class="f" style="margin-top:14px">Notes on invoice<textarea id="notes" placeholder="Optional — prints on the invoice">${esc(st.notes)}</textarea></label>
          </div>
          <div class="row"><button class="btn primary" id="save">${editing ? 'Save changes' : 'Save as draft'}</button><span class="small muted" id="savehint"></span></div>
        </div>
        <div class="previewbox" id="preview"></div>
      </div>`);
    bind(); preview();
  }

  function preview() {
    const d = draftInvoice();
    if (!d.ok) { $('#preview').innerHTML = '<div class="empty">Set a valid period to preview.</div>'; return; }
    $('#preview').innerHTML = renderDoc({ ...d.row, invoice_number: editing?.invoice_number, status: 'draft' }, S.settings);
  }

  function bind() {
    $('#plan').onchange = e => { st.planId = e.target.value; st.periodStart = ''; st.periodEnd = ''; st.custom = false; st.year = year; st.participants = ''; st.exclusions = []; pickDefaultPeriod(); st.values = defaultValueRows(plan(), { start: st.periodStart, end: st.periodEnd }); prev = prefillFromHistory(); draw(); };
    $('#idate').onchange = e => { st.invoiceDate = e.target.value || todayISO(); preview(); };
    $('#year').onchange = e => { st.year = +e.target.value || year; applyPeriod(); resetValueLabels(); draw(); };
    $('#period').onchange = e => {
      if (e.target.value === 'custom') { st.custom = true; st.periodLabel = ''; }
      else { st.custom = false; st.periodIdx = +e.target.value; applyPeriod(); }
      resetValueLabels(); draw();
    };
    $('#svc').onchange = e => { st.serviceStart = e.target.value; preview(); };
    if ($('#ps')) {
      $('#ps').onchange = e => { st.periodStart = e.target.value; preview(); };
      $('#pe').onchange = e => { st.periodEnd = e.target.value; preview(); };
      $('#pl').oninput = e => { st.periodLabel = e.target.value; preview(); };
    }
    $('#pp').oninput = e => { st.participants = e.target.value.replace(/[^\d]/g, ''); preview(); };
    $('#notes').oninput = e => { st.notes = e.target.value; preview(); };
    $$('[data-rk]').forEach(t => t.addEventListener('input', () => { st[t.dataset.rk][+t.dataset.i][t.dataset.f] = t.value; preview(); }));
    $$('[data-add]').forEach(b => b.onclick = () => { const k = b.dataset.add; st[k].push(k === 'adjustments' ? { label: '', amount: '' } : { label: '', value: '' }); draw(); });
    $$('[data-del]').forEach(b => b.onclick = () => { st[b.dataset.del].splice(+b.dataset.i, 1); if (b.dataset.del === 'values' && !st.values.length) st.values.push({ label: '', value: '' }); draw(); });
    $('#save').onclick = save;
  }

  function resetValueLabels() {
    // keep entered numbers when only labels change; regenerate labels for the new period
    const fresh = defaultValueRows(plan(), { start: st.periodStart, end: st.periodEnd });
    st.values = fresh.map((f, i) => ({ label: f.label, value: st.values[i]?.value ?? '' }));
  }

  async function save() {
    const d = draftInvoice();
    if (!d.ok) return toast('Set a valid period', true);
    if (!d.calc.valuation.billable && !d.calc.total) return toast('Enter at least one value', true);
    $('#save').disabled = true;
    try {
      let saved;
      if (editing) {
        const patch = { ...d.row }; delete patch.plan_id;
        if (editing.status === 'reviewed') Object.assign(patch, statusPatch('draft'));
        saved = await DB.updateInvoice(editing.id, patch);
        toast(editing.status === 'reviewed' ? 'Saved — moved back to draft for re-review' : 'Saved');
      } else { saved = await DB.createInvoice(d.row); toast(`Draft ${saved.invoice_number} created`); }
      S.loaded = false; location.hash = '#/invoice/' + saved.id;
    } catch (e) { toast(e.message || String(e), true); $('#save').disabled = false; }
  }

  draw();
}

/* =========================================================================
   VIEW: BILLING RUN (all plans for a period at once)
   ========================================================================= */
async function viewRun() {
  await refresh();
  const year = new Date().getFullYear();
  const st = { freq: 'quarterly', year, idx: null, invoiceDate: todayISO(), data: {} };
  const t = todayISO();
  const pickIdx = () => { const per = C.periodsFor(st.freq, st.year); let i = -1; per.forEach((x, k) => { if (x.end < t) i = k; }); if (i < 0) { st.year--; return pickIdx(); } st.idx = i; };
  pickIdx();

  const existingFor = (p, period) => S.invoices.find(i => i.plan_id === p.id && i.period_start === period.start && i.period_end === period.end && i.status !== 'void');
  const nValsFor = (p, d) => p.valuation_method === 'average' ? d.values.length : 1;
  function inputsFor(p, d, period) {
    return { periodStart: period.start, periodEnd: period.end, serviceStart: null,
      values: d.values.slice(0, nValsFor(p, d)).map(v => ({ label: v.label, value: C.num(v.value) })),
      exclusions: C.num(d.excl) ? [{ label: d.exclLabel || 'Excluded assets', value: C.num(d.excl) }] : [],
      participants: C.num(d.participants), adjustments: [] };
  }

  function recalc() {
    const period = C.periodsFor(st.freq, st.year)[st.idx];
    const plans = S.plans.filter(p => p.active && p.frequency === st.freq);
    let total = 0, ready = 0;
    plans.forEach(p => {
      const cell = $(`[data-fee="${p.id}"]`); if (!cell) return;
      const d = st.data[p.id];
      const calc = C.calculate(p, inputsFor(p, d, period));
      const has = calc.valuation.billable > 0;
      if (has && d.include) { total += calc.total; ready++; }
      cell.innerHTML = has ? `<b>${money(calc.total)}</b>${calc.effectiveBps ? `<div class="small muted">${calc.effectiveBps.toFixed(1)} bps</div>` : ''}` : '<span class="muted">—</span>';
    });
    const f = $('#runfoot'); if (f) f.innerHTML = `<td></td><td colspan="4">${ready} ready to create</td><td class="r">${money(total)}</td>`;
    const cr = $('#create'); if (cr) { cr.disabled = !ready; cr.textContent = `Create ${ready} draft${ready === 1 ? '' : 's'}`; }
  }

  function draw() {
    const per = C.periodsFor(st.freq, st.year);
    const period = per[st.idx];
    const plans = S.plans.filter(p => p.active && p.frequency === st.freq);
    const rows = plans.map(p => {
      const existing = existingFor(p, period);
      const d = st.data[p.id] || (st.data[p.id] = initRow(p, period));
      const nVals = nValsFor(p, d);
      return `<tr>
        <td>${existing ? '' : `<input type="checkbox" data-inc="${esc(p.id)}" ${d.include ? 'checked' : ''}>`}</td>
        <td><b>${esc(p.name)}</b><div class="small muted">${esc(p.code)} · ${esc(LABELS.valuation_method[p.valuation_method])}${p.timing === 'advance' ? ' · advance' : ''}</div></td>
        ${existing ? `<td colspan="4" class="small">Already invoiced: <a href="#/invoice/${esc(existing.id)}">${esc(existing.invoice_number)}</a> ${chip(existing.status)} ${money(existing.amount)}</td>` : `
        <td><div class="row" style="gap:4px;flex-wrap:nowrap">${d.values.slice(0, nVals).map((v, i) => `<input type="text" class="money" style="min-width:110px" data-pid="${esc(p.id)}" data-vi="${i}" value="${esc(v.value)}" placeholder="${esc(nVals > 1 ? v.label.replace('Value as of ', '') : 'Value')}">`).join('')}</div></td>
        <td><input type="text" class="money" style="min-width:100px" data-pid="${esc(p.id)}" data-f="excl" value="${esc(d.excl)}" placeholder="0"></td>
        <td><input type="text" class="numr" style="width:80px" data-pid="${esc(p.id)}" data-f="participants" value="${esc(d.participants)}"></td>
        <td class="r" data-fee="${esc(p.id)}"></td>`}
      </tr>`;
    }).join('');
    main(`
      <div class="spread"><div><div class="eyebrow">401(k) / Fee Billing</div><h1>Billing run</h1><p class="sub" style="margin:0">Enter values for every plan on the same schedule, review the fees, and create all drafts at once.</p></div></div>
      <div class="card"><div class="grid g4">
        <label class="f">Frequency<select id="rf">${opts(LABELS.frequency, st.freq)}</select></label>
        <label class="f">Year<input type="number" id="ry" value="${st.year}"></label>
        <label class="f">Period<select id="rp">${per.map((x, i) => `<option value="${i}"${i === st.idx ? ' selected' : ''}>${esc(x.label)}</option>`).join('')}</select></label>
        <label class="f">Invoice date<input type="date" id="rd" value="${esc(st.invoiceDate)}"></label></div>
        <details style="margin-top:12px"><summary class="small" style="cursor:pointer">Paste values from a spreadsheet</summary>
          <div class="hint">One plan per line: <span class="mono">PLANCODE, value, excluded, participants</span>. Average-valuation plans take one value per month-end before the excluded column. Copy straight from Excel (tab-separated) or type with ", " between columns.</div>
          <textarea id="paste" rows="4" style="margin-top:6px;font-family:var(--mono);font-size:12.5px" placeholder="ACME401K, 7,512,330, 120,000, 148"></textarea>
          <button class="btn sm" id="applypaste" style="margin-top:6px">Apply</button></details>
      </div>
      ${plans.length ? `<div class="card" style="padding:0"><div class="tablewrap"><table class="t">
        <thead><tr><th style="width:28px"><input type="checkbox" id="incall" checked></th><th>Plan</th><th>Value(s)</th><th>Excluded</th><th>Participants</th><th class="r">Fee</th></tr></thead>
        <tbody>${rows}</tbody>
        <tfoot><tr id="runfoot"></tr></tfoot></table></div></div>
        <div class="row"><button class="btn primary" id="create" disabled>Create drafts</button><span class="hint">Plans without a value are skipped. Each draft still goes through review → approve.</span></div>`
        : `<div class="card empty">No active ${esc(LABELS.frequency[st.freq].toLowerCase())} plans. <a href="#/plans">Manage plans</a></div>`}`);

    $('#rf').onchange = e => { st.freq = e.target.value; st.year = year; st.data = {}; pickIdx(); draw(); };
    $('#ry').onchange = e => { st.year = +e.target.value || year; st.idx = Math.min(st.idx, C.periodsFor(st.freq, st.year).length - 1); st.data = {}; draw(); };
    $('#rp').onchange = e => { st.idx = +e.target.value; st.data = {}; draw(); };
    $('#rd').onchange = e => { st.invoiceDate = e.target.value || todayISO(); };
    $$('input[data-pid]').forEach(el => el.addEventListener('input', () => {
      const d = st.data[el.dataset.pid];
      if (el.dataset.vi !== undefined) d.values[+el.dataset.vi].value = el.value;
      else d[el.dataset.f] = el.dataset.f === 'participants' ? el.value.replace(/[^\d]/g, '') : el.value;
      recalc();
    }));
    $$('[data-inc]').forEach(el => el.onchange = () => { st.data[el.dataset.inc].include = el.checked; recalc(); });
    const ia = $('#incall'); if (ia) ia.onchange = () => { Object.values(st.data).forEach(d => d.include = ia.checked); $$('[data-inc]').forEach(c => c.checked = ia.checked); recalc(); };
    $('#applypaste').onclick = () => {
      let n = 0; const miss = [];
      $('#paste').value.split(/\r?\n/).map(l => l.trim()).filter(Boolean).forEach(line => {
        const cells = line.includes('\t') ? line.split('\t') : (/,\s/.test(line) ? line.split(/,\s+/) : line.split(','));
        const code = (cells[0] || '').trim();
        const p = plans.find(x => x.code.toLowerCase() === code.toLowerCase());
        if (!p || existingFor(p, period)) { if (code) miss.push(code); return; }
        const d = st.data[p.id]; const nVals = nValsFor(p, d);
        const rest = cells.slice(1).map(c => c.trim());
        for (let i = 0; i < nVals; i++) if (rest[i]) d.values[i].value = commas(C.num(rest[i]));
        if (rest[nVals]) d.excl = commas(C.num(rest[nVals]));
        if (rest[nVals + 1]) d.participants = String(Math.round(C.num(rest[nVals + 1])));
        n++;
      });
      draw(); toast(`${n} plan${n === 1 ? '' : 's'} filled${miss.length ? ` · skipped: ${miss.join(', ')}` : ''}`, !!miss.length && !n);
    };
    const cr = $('#create'); if (cr) cr.onclick = async () => {
      cr.disabled = true; let made = 0;
      for (const p of plans) {
        const d = st.data[p.id]; if (!d.include || existingFor(p, period)) continue;
        const inputs = inputsFor(p, d, period);
        const calc = C.calculate(p, inputs); if (!(calc.valuation.billable > 0)) continue;
        try {
          await DB.createInvoice({ plan_id: p.id, period_label: period.label, period_start: period.start, period_end: period.end, invoice_date: st.invoiceDate, due_date: p.billing_method === 'deduct_from_plan' ? null : addDays(st.invoiceDate, +p.terms_days || 30), inputs, plan_snapshot: planSnapshot(p), calc, amount: calc.total, billable_assets: calc.valuation.billable, notes: null });
          made++;
        } catch (e) { toast(`${p.code}: ${e.message}`, true); }
      }
      toast(`${made} draft${made === 1 ? '' : 's'} created for ${period.label}`); invFilter = { status: '', period: period.label, q: '' }; location.hash = '#/invoices';
    };
    recalc();
  }
  function initRow(p, period) {
    const prev = S.invoices.filter(i => i.plan_id === p.id && i.status !== 'void').sort((a, b) => b.period_end.localeCompare(a.period_end))[0];
    const ex = prev?.inputs?.exclusions?.[0];
    return { include: true, values: defaultValueRows(p, period).map(v => ({ ...v })), excl: '', exclLabel: ex?.label || '', participants: prev?.inputs?.participants ? String(prev.inputs.participants) : '' };
  }
  draw();
}

              <button class="btn sm" id="addtier" style="margin-top:6px">+ Add tier</button>
              <div class="hint">${s.type === 'tiered' ? 'Each rate applies only to the assets within its band (graduated).' : 'The whole balance is billed at the rate of the band it falls in.'} 100 bps = 1.00%.</div>` : ''}
            ${s.type === 'flat_bps' ? `<label class="f" style="max-width:200px;margin-top:12px">Annual rate (bps)<input type="text" class="numr" data-s="flatBps" value="${esc(s.flatBps ?? '')}"></label>` : ''}
            ${s.type === 'flat_fee' ? `<label class="f" style="max-width:240px;margin-top:12px">Annual flat fee ($)<input type="text" class="money" data-s="flatAnnualFee" value="${esc(commas(s.flatAnnualFee))}"></label>` : ''}
            <div class="sectionlabel">Additional terms (annual amounts, optional)</div>
            <div class="grid g3">
              <label class="f">Base fee ($/yr)<input type="text" class="money" data-s="baseFeeAnnual" value="${esc(commas(s.baseFeeAnnual))}"></label>
              <label class="f">Per participant ($/yr)<input type="text" class="money" data-s="perParticipantAnnual" value="${esc(commas(s.perParticipantAnnual))}"></label>
              <label class="f">Discount (%)<input type="text" class="numr" data-s="discountPct" value="${esc(s.discountPct ?? '')}"></label>
              <label class="f">Annual minimum ($)<input type="text" class="money" data-s="minimumAnnual" value="${esc(commas(s.minimumAnnual))}"></label>
              <label class="f">Annual maximum ($)<input type="text" class="money" data-s="maximumAnnual" value="${esc(commas(s.maximumAnnual))}"></label>
            </div>
            <div class="hint">Minimum/maximum are annual and prorate to each period, applied before discount and adjustments.</div></div>
          <div class="card"><h2>Status & notes</h2>
            <label class="check"><input type="checkbox" data-p="active" ${p.active ? 'checked' : ''}> Active (included in billing runs)</label>
            <label class="f" style="margin-top:10px">Internal notes<textarea data-p="notes" rows="2">${esc(p.notes)}</textarea></label></div>
        </div>
        <div><div class="card" style="position:sticky;top:70px"><h2>Fee check</h2>
          <div class="grid g2"><label class="f">Sample assets<input type="text" class="money" id="sa" value="${esc(commas(sample))}"></label>
            <label class="f">Participants<input type="text" class="numr" id="sp" value="${esc(sampleP)}"></label></div>
          <div id="feecheck" style="margin-top:12px"></div></div></div>
      </div>`);
    bind(); feeCheck();
  }
  function feeCheck() {
    const ppy = C.PERIODS[p.frequency] || 4;
    const yr = new Date().getFullYear();
    const per = C.periodsFor(p.frequency, yr)[0];
    const r = C.calculate({ ...p, proration: 'periodic' }, { periodStart: per.start, periodEnd: per.end, values: [{ value: sample }], participants: sampleP });
    $('#feecheck').innerHTML = `<table class="t"><tbody>
      ${r.lines.map(l => `<tr><td class="small">${esc(l.label)}</td><td class="r">${money(l.annual)}</td></tr>`).join('')}
      ${r.minMax ? `<tr><td class="small">${esc(r.minMax.label)}</td><td class="r">${money(r.minMax.amount * ppy)}</td></tr>` : ''}
      ${r.discount ? `<tr><td class="small">${esc(r.discount.label)}</td><td class="r">${money(r.discount.amount * ppy)}</td></tr>` : ''}
      </tbody><tfoot><tr><td>Annual fee</td><td class="r">${money(r.feeBeforeAdjustments * ppy)}</td></tr>
      <tr><td>Per ${({ monthly: 'month', quarterly: 'quarter', semiannual: 'half-year', annual: 'year' })[p.frequency]}</td><td class="r">${money(r.feeBeforeAdjustments)}</td></tr>
      <tr><td>Effective rate</td><td class="r">${r.effectiveBps !== null ? r.effectiveBps.toFixed(2) + ' bps' : '—'}</td></tr></tfoot></table>
      <div class="hint">Illustrative, full period, periodic proration.</div>`;
  }
  function bind() {
    $$('[data-p]').forEach(el => {
      const ev = el.type === 'checkbox' || el.tagName === 'SELECT' ? 'change' : 'input';
      el.addEventListener(ev, () => {
        const k = el.dataset.p; p[k] = el.type === 'checkbox' ? el.checked : (k === 'terms_days' ? +el.value : (k === 'code' ? el.value.toUpperCase().replace(/\s+/g, '') : el.value));
        if (['frequency'].includes(k)) feeCheck();
      });
    });
    $('#stype').onchange = e => {
      p.schedule.type = e.target.value;
      if ((p.schedule.type === 'tiered' || p.schedule.type === 'breakpoint') && !(p.schedule.tiers || []).length) p.schedule.tiers = [{ upTo: 1000000, bps: 50 }, { upTo: null, bps: 35 }];
      draw();
    };
    $$('[data-t]').forEach(el => el.addEventListener('input', () => { p.schedule.tiers[+el.dataset.t][el.dataset.tf] = C.num(el.value); feeCheck(); }));
    $$('[data-s]').forEach(el => el.addEventListener('input', () => { p.schedule[el.dataset.s] = el.value === '' ? '' : C.num(el.value); feeCheck(); }));
    $$('[data-deltier]').forEach(b => b.onclick = () => { p.schedule.tiers.splice(+b.dataset.deltier, 1); if (p.schedule.tiers.length) p.schedule.tiers[p.schedule.tiers.length - 1].upTo = null; draw(); });
    const at = $('#addtier'); if (at) at.onclick = () => {
      const t = p.schedule.tiers; const last = t[t.length - 1];
      const prevCap = t.length > 1 ? C.num(t[t.length - 2].upTo) : 0;
      if (last) last.upTo = prevCap ? prevCap * 2 : 1000000;
      t.push({ upTo: null, bps: last ? last.bps : 25 }); draw();
    };
    $('#sa').addEventListener('input', e => { sample = C.num(e.target.value); feeCheck(); });
    $('#sp').addEventListener('input', e => { sampleP = C.num(e.target.value); feeCheck(); });
    $('#savep').onclick = async () => {
      if (!p.name.trim() || !p.code.trim() || !p.sponsor_name.trim()) return toast('Plan name, code and sponsor are required', true);
      const s = p.schedule;
      if (s.type === 'tiered' || s.type === 'breakpoint') {
        if (!s.tiers.length) return toast('Add at least one tier', true);
        const caps = s.tiers.slice(0, -1).map(t => C.num(t.upTo));
        if (caps.some((c, i) => c <= 0 || (i && c <= caps[i - 1]))) return toast('Tier caps must be positive and increasing', true);
        s.tiers = s.tiers.map((t, i, a) => ({ upTo: i === a.length - 1 ? null : C.num(t.upTo), bps: C.num(t.bps) }));
      }
      try { const saved = await DB.savePlan(p); toast('Plan saved'); S.loaded = false; await refresh(); location.hash = '#/plan/' + saved.id; if (!isNew) viewPlan(saved.id); }
      catch (e) { toast(e.code === '23505' ? `Plan code "${p.code}" is already used.` : (e.message || String(e)), true); }
    };
  }
  draw();
}

/* =========================================================================
   VIEW: SETTINGS
   ========================================================================= */
async function viewSettings() {
  await refresh();
  const s = deep(S.settings);
  main(`
    <div class="eyebrow">401(k) / Fee Billing</div><h1>Settings</h1><p class="sub">Letterhead and standard language on every invoice and statement</p>
    <div class="split">
      <div class="card">
        <div class="grid g2">
          <label class="f">Firm name<input type="text" data-k="firmName" value="${esc(s.firmName)}"></label>
          <label class="f">Logo URL (optional)<input type="text" data-k="logoUrl" value="${esc(s.logoUrl)}" placeholder="https://…/logo.png"></label>
          <label class="f">Phone<input type="text" data-k="phone" value="${esc(s.phone)}"></label>
          <label class="f">Email<input type="text" data-k="email" value="${esc(s.email)}"></label>
          <label class="f" style="grid-column:1/-1">Address<textarea data-k="address" rows="2">${esc(s.address)}</textarea></label>
          <label class="f" style="grid-column:1/-1">Remittance instructions (invoices)<textarea data-k="remit" rows="3">${esc(s.remit)}</textarea></label>
          <label class="f" style="grid-column:1/-1">Note on fee statements (deduct from plan)<textarea data-k="deductNote" rows="2">${esc(s.deductNote)}</textarea></label>
          <label class="f" style="grid-column:1/-1">Disclosure footer<textarea data-k="disclosure" rows="4">${esc(s.disclosure)}</textarea></label>
        </div>
        <div class="row" style="margin-top:14px"><button class="btn primary" id="saves">Save settings</button><button class="btn" id="backup">Download backup (JSON)</button></div>
        <div class="hint">Settings changes apply to how every invoice prints, including past ones. Figures on past invoices never change.</div>
      </div>
      <div class="previewbox" id="spreview"></div>
    </div>`);
  const sampleInv = () => {
    const plan = S.plans[0] || { ...BLANK_PLAN(), name: 'Sample Company 401(k) Plan', sponsor_name: 'Sample Company, Inc.', contact_address: '100 Main St\nIrvine, CA 92618' };
    const per = C.periodsFor('quarterly', new Date().getFullYear())[0];
    const calc = C.calculate(plan, { periodStart: per.start, periodEnd: per.end, values: [{ label: `Value as of ${fmtDate(per.end)}`, value: 5000000 }], participants: 100 });
    return { invoice_number: 'SAMPLE', status: 'approved', invoice_date: todayISO(), due_date: addDays(todayISO(), 30), period_label: per.label, period_start: per.start, period_end: per.end, plan_snapshot: planSnapshot(plan), calc };
  };
  const pv = () => { $('#spreview').innerHTML = renderDoc(sampleInv(), s); };
  $$('[data-k]').forEach(el => el.addEventListener('input', () => { s[el.dataset.k] = el.value; pv(); }));
  $('#saves').onclick = async () => { try { await DB.saveSettings(s); S.settings = s; toast('Settings saved'); } catch (e) { toast(e.message, true); } };
  $('#backup').onclick = () => download(`plan-billing-backup-${todayISO()}.json`, JSON.stringify({ exported_at: new Date().toISOString(), plans: S.plans, invoices: S.invoices.map(i => { const x = { ...i }; delete x.plan; return x; }), settings: S.settings }, null, 2), 'application/json');
  pv();
}

/* =========================================================================
   AUTH + BOOT
   ========================================================================= */
function loginScreen(msg) {
  $('#app').innerHTML = `<div class="authgate"><form class="authcard" id="lf">
    <div class="auth-logo"><span class="logo-mount">REDMOUNT</span><span class="logo-capital">CAPITAL PARTNERS</span></div>
    <h1>Plan Billing</h1>
    <p class="sub">Sign in to access the workspace.</p>
    <label for="le">Email</label><input type="email" id="le" autocomplete="username">
    <label for="lp">Password</label><input type="password" id="lp" autocomplete="current-password">
    <button type="submit" id="lb">Sign in</button>
    <div class="err" id="lerr">${esc(msg || '')}</div>
    <div class="foot">Signed in on the <a href="${esc(CONFIG.TERMINAL_URL)}">Terminal</a>? You're signed in here too.</div>
  </form></div>`;
  $('#lf').onsubmit = async e => {
    e.preventDefault();
    const email = $('#le').value.trim(), pw = $('#lp').value;
    if (!email || !pw) { $('#lerr').textContent = 'Enter an email and password.'; return; }
    $('#lb').disabled = true;
    try { await Auth.signIn(email, pw); boot(); }
    catch (err) { $('#lerr').textContent = err.message || 'Incorrect email or password'; $('#lb').disabled = false; }
  };
}

async function boot() {
  if (LOCAL) { DB.user = { email: 'local test mode' }; }
  else {
    let s; try { s = await Auth.session(); } catch (e) { return loginScreen(); }
    DB.user = { email: s.email };
  }
  shell();
  window.removeEventListener('hashchange', route);
  window.addEventListener('hashchange', route);
  await route();
}

window.__billing = { C, DB, renderDoc }; // for debugging in the console
boot();
})();
</script>
